<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お支払いが完了しませんでした｜ここいこ</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap" style="padding-bottom:30px">
  <div class="phd"><b style="margin:0 auto">お支払い結果</b></div>
  <div class="res"><div class="ic" style="background:#FDECEC">⚠️</div><h1>お支払いが完了しませんでした</h1><p id="msg">時間をおいて、もう一度お試しください。</p><p class="note" id="code" style="margin-top:6px"></p><p class="note">料金は請求されていません。</p></div>
  <div class="rbox" id="sum" hidden></div>
  <div class="res-actions"><a class="cta" id="retry" href="checkout.html" style="display:block">入力画面に戻る</a><a class="btn2" href="index.html">トップに戻る</a></div>
  <p class="note" style="text-align:center;margin:12px 18px">解決しない場合はお問い合わせください：<br><span id="contact"></span></p>
  <footer id="footer"></footer>
</div>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script>
// 결제 실패·취소: 승인 API를 호출하지 않는다. 사유 안내 + 입력값을 유지한 채 결제 화면으로 복귀
(function () {
  var K = window.KOKOIKO, q = new URLSearchParams(location.search);
  var code = q.get("code") || "", message = q.get("message") || "", pid = q.get("product") || "", date = q.get("date") || "", qty = q.get("qty") || "1";
  var friendly = { PAY_PROCESS_CANCELED: "お支払いがキャンセルされました。", PAY_PROCESS_ABORTED: "お支払いが中断されました。", REJECT_CARD_COMPANY: "カード会社により承認されませんでした。別のカードをお試しください。", AMOUNT_MISMATCH: "金額の確認ができませんでした。もう一度お試しください。", INVALID_ORDER: "注文情報を確認できませんでした。もう一度お試しください。" };
  document.getElementById("msg").textContent = friendly[code] || message || "時間をおいて、もう一度お試しください。";
  document.getElementById("code").textContent = code ? "エラーコード：" + code : "";
  document.getElementById("contact").innerHTML = K.contactLinks();
  var p = K.products[pid];
  if (p && date) {
    document.getElementById("retry").href = "checkout.html?product=" + pid + "&date=" + date + "&qty=" + qty;
    var s = document.getElementById("sum"); s.hidden = false;
    s.innerHTML = '<div class="r"><span>ツアー</span><b>' + p.title + '</b></div><div class="r"><span>参加日</span><b>' + K.jpLong(date) + '</b></div><div class="r"><span>人数</span><b>' + qty + '名</b></div><p class="note">入力した内容は保存されています。</p>';
  } else if (p) { document.getElementById("retry").href = p.page; }
  else { document.getElementById("retry").href = "index.html"; }
  K.track("payment_fail", { code: code, product: pid });
})();
</script>
</body>
</html>
