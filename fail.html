<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>お支払いが完了しませんでした｜ここいこ</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=19">
</head>
<body>
<div class="wrap" style="padding-bottom:30px">
  <div class="phd"><b style="margin:0 auto">お支払い結果</b></div>
  <div class="sec" id="prd" hidden></div>
  <div class="sec" style="border-bottom:none"><div class="rst"><b class="ng">お支払い未完了</b><span id="when"></span></div><div id="sum"></div>
    <div class="why"><b id="msg">時間をおいて、もう一度お試しください。</b><p>料金は請求されていません。<br><span id="kept">入力した内容は保存されています。</span></p><small id="code"></small></div></div>
  <div class="ract"><a class="cta" id="retry" href="checkout.html">入力画面に戻る</a><a class="tl" href="index.html">トップに戻る</a>
    <p class="note" style="text-align:center;margin-top:20px">解決しない場合はお問い合わせください<br><span id="contact"></span></p></div>
  <footer id="footer"></footer>
</div>
<script src="js/data.js?v=19"></script>
<script src="js/common.js?v=19"></script>
<script>
// 결제 실패·취소: 승인 API를 호출하지 않는다. 사유 안내 + 입력값을 유지한 채 결제 화면으로 복귀
(function () {
  var K = window.KOKOIKO, q = new URLSearchParams(location.search);
  var code = q.get("code") || "", message = q.get("message") || "", pid = q.get("product") || "", date = q.get("date") || "", qty = q.get("qty") || "1";
  var friendly = { PAY_PROCESS_CANCELED: "お支払いがキャンセルされました。", PAY_PROCESS_ABORTED: "お支払いが中断されました。", REJECT_CARD_COMPANY: "カード会社により承認されませんでした。別のカードをお試しください。", AMOUNT_MISMATCH: "金額の確認ができませんでした。もう一度お試しください。", INVALID_ORDER: "注文情報を確認できませんでした。もう一度お試しください。" };
  document.getElementById("msg").textContent = friendly[code] || message || "時間をおいて、もう一度お試しください。";
  document.getElementById("code").textContent = code ? "エラーコード：" + code : "";
  document.getElementById("contact").innerHTML = K.contactLinks();
  var p = K.products[pid];
  if (p && date) {
    document.getElementById("retry").href = "checkout.html?product=" + pid + "&date=" + date + "&qty=" + qty;
    document.getElementById("when").textContent = K.jpLong(date) + " " + p.timeShort;
    document.getElementById("sum").innerHTML = '<div class="rr"><span>人数</span><b>' + qty + '名</b></div><div class="rr t"><span>お支払い金額</span><b>' + K.krw(p.priceKrw * (+qty || 1)) + '</b></div>';
  } else if (p) { document.getElementById("retry").href = p.page; document.getElementById("kept").textContent = ""; }
  else { document.getElementById("retry").href = "index.html"; document.getElementById("retry").textContent = "トップに戻る"; document.getElementById("kept").textContent = ""; }
  if (p) { var pr = document.getElementById("prd"); pr.hidden = false; pr.innerHTML = '<div class="rprd"><div class="im" style="background-image:url(' + K.img(p.hero[0]) + ')"></div><div><b>' + p.name + '</b><span>ソウル発 日帰り ・ 送迎バス付き</span></div></div>'; }
  K.track("payment_fail", { code: code, product: pid });
})();
</script>
</body>
</html>
