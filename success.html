<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ご予約完了｜ここいこ</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1126-1">
</head>
<body>
<div class="wrap" style="padding-bottom:16px">
  <div class="phd"><b style="margin:0 auto">お支払い結果</b></div>
  <main id="app"><div class="res"><div class="ic" style="background:#F5F3F4"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="#F1E3E8"/><path class="kkspin" d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5" stroke="#C82158"/></svg></div><h1>お支払いを確認しています…</h1><p>このままお待ちください。<br>画面を閉じないでください。</p></div></main>
</div>
<script src="js/data.js?v=1126-1"></script>
<script src="js/common.js?v=1126-1"></script>
<script>
// 결제 성공: 서버(/api/confirm)에서 금액 검증 후 승인 → 완료 화면 + 공유
(function () {
  var K = window.KOKOIKO, app = document.getElementById("app");
  var q = new URLSearchParams(location.search);
  var body = { paymentKey: q.get("paymentKey"), orderId: q.get("orderId"), amount: Number(q.get("amount")) };
  var bk = null; try { bk = JSON.parse(sessionStorage.getItem("kk_booking") || "null"); } catch (e) {}
  var p = null; // 결제 완료 후 서버가 돌려준 상품으로 정함

  function fail(code, message) {
    K.track("payment_fail", { code: code || "", stage: "confirm" });
    location.replace("fail.html?code=" + encodeURIComponent(code || "CONFIRM_FAILED") + "&message=" + encodeURIComponent(message || "") +
      (bk ? "&product=" + bk.product + "&date=" + bk.date + "&qty=" + bk.qty : ""));
  }
  if (!body.paymentKey || !body.orderId) { fail("INVALID_ACCESS", "決済情報が見つかりません。"); return; }

  fetch("/api/confirm", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok) { fail(res.j.code, res.j.message); return; }
      var d = res.j;
      p = K.products[d.productId] || K.products[(bk && bk.product)] || K.products["jeonju-damyang"];
      var day = d.date || (bk && bk.date);
      K.track("purchase", { transaction_id: d.orderId, value: d.totalAmount, currency: "KRW", product: d.productId, quantity: d.qty });
      try { sessionStorage.removeItem("kk_form"); sessionStorage.removeItem("kk_sel_" + p.id); } catch (e) {}
      history.replaceState(null, "", location.pathname);
      var qty = d.qty || (bk && bk.qty) || 1;
      // 결제수단: 토스 승인 응답 method(한국어 값)를 일본어로 표시 — 문구 확인 필요(임시)
      var PAYM = { "카드": "クレジット・デビットカード", "간편결제": "簡単決済", "계좌이체": "口座振替", "가상계좌": "バーチャル口座", "휴대폰": "携帯電話決済" };
      app.innerHTML =
        // 1. 상태 + 예약 핵심(상품·참가일·인원·집합장소)
        '<div class="sec rhero"><h1 class="ok">決済完了</h1></div>' +
        '<div class="sec"><details class="acc chev"><summary>ご予約内容</summary><div class="accb ordb">' +
          '<div class="psum"><b>' + p.name + '</b><div class="im" style="background-image:url(' + K.img(p.hero[0]) + ')"></div></div>' +
          (day ? '<div class="rr"><span>参加日</span><b>' + K.jpLong(day) + ' ' + p.timeShort + '</b></div>' : '') +
          '<div class="rr"><span>人数</span><b>' + qty + '名</b></div>' +
          '<div class="rr"><span>集合場所</span><b>' + K.MEETING.ja + '<button type="button" class="cpy" id="addrCopy">コピー</button></b></div>' +
        '</div></details></div>' +
        // 2. 결제 내역(항목별 금액 → 합계 원화·엔화)
        '<div class="sec"><h2>お支払い内訳</h2>' +
          '<div class="rr"><span>参加費 ' + K.krw(p.priceKrw) + ' × ' + qty + '名</span><b>' + K.krw(p.priceKrw * qty) + '</b></div>' +
          '<div class="rr t"><span>合計</span><b class="ty2">' + K.yen(d.totalAmount, K.FALLBACK_JPY_PER_KRW) + '<small>' + K.krw(d.totalAmount) + '</small></b></div>' +
          '<div class="rr"><span>お支払い方法</span><b>' + (PAYM[d.method] || d.method || "—") + '</b></div>' +
          '<div class="rr"><span>注文番号</span><b class="oid">' + d.orderId + '</b></div>' +
          // 안내 1·2·3: 결제 페이지와 같은 문구·같은 양식(소제목 없이 금액 아래 박스)
          '<div class="cond2"><p>1. お支払い後は「予約待ち」、' + K.MIN_PEOPLE + '名集まった時点で出発確定。</p><p>2. ' + K.MIN_PEOPLE + '名未満の場合は出発' + K.CLOSE_DAYS_BEFORE + '日前にご連絡し、全額返金。</p><p>3. 出発' + K.CLOSE_DAYS_BEFORE + '日前まで全額返金、それ以降のキャンセルは返金不可。</p></div>' +
        '</div>' +
        // 4. 다음 행동
        '<div class="ract"><a class="cta" href="index.html">確認</a><a class="tl ext" id="lineBtn" href="#">LINEで問い合わせる ›</a></div>';
      K.getRate().then(function (c) { var y = document.querySelector('.rr.t .ty2'); if (y) y.firstChild.nodeValue = K.yen(d.totalAmount, c.rate); });
      document.getElementById("addrCopy").onclick = function () {
        var t = K.MEETING.ko, ok = function () { K.toast("住所をコピーしました"); };
        if (navigator.clipboard) navigator.clipboard.writeText(t).then(ok, ok); else ok();
      };
      document.getElementById("lineBtn").onclick = function (e) { e.preventDefault(); K.track("line_click", { place: "complete" }); if (K.LINE_ADD_URL) location.href = K.LINE_ADD_URL; else K.toast("ただいま準備中です"); };
    })
    .catch(function () { fail("NETWORK", "通信エラーが発生しました。"); });
})();
</script>
<button class="totop nobar" id="totop" aria-label="ページの先頭へ"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2A2230" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg></button>
<script>(function(){var t=document.getElementById("totop");if(!t)return;addEventListener("scroll",function(){t.classList.toggle("on",scrollY>600)},{passive:true});t.onclick=function(){scrollTo({top:0,behavior:"smooth"})};})();</script>
</body>
</html>
